[theme]
base = "light"
font = "sans serif"
showWidgetBorder = true
baseRadius = "medium"

[theme.light]
primaryColor = "#ad687f"
backgroundColor = "#fffaf6"
secondaryBackgroundColor = "#f8eef0"
textColor = "#49363d"
borderColor = "#e4c4cc"

[theme.dark]
primaryColor = "#a184ee"
backgroundColor = "#100d1d"
secondaryBackgroundColor = "#211638"
textColor = "#eee9ff"
borderColor = "#493967"
